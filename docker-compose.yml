version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: feedscope-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: feedscope
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - feedscope-network

  # Python Sentiment Service
  sentiment-service:
    build:
      context: ./sentiment-service
      dockerfile: Dockerfile
    container_name: feedscope-sentiment
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      MODEL_NAME: distilbert-base-uncased-finetuned-sst-2-english
    networks:
      - feedscope-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; exit(0 if requests.get('http://localhost:8001/health').status_code == 200 else 1)" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Node.js Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: feedscope-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://admin:password123@mongodb:27017/feedscope?authSource=admin
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      SENTIMENT_SERVICE_URL: http://sentiment-service:8001
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_started
      sentiment-service:
        condition: service_healthy
    networks:
      - feedscope-network
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); })\"" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # React Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: feedscope-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - feedscope-network

networks:
  feedscope-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
